name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    # A hung process-heavy suite must fail visibly, not stall the queue.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.15.0
          - os: macos-latest
            node: 22
    env:
      # Process-spawning suites overwhelm small CI runners at full parallelism;
      # two workers keeps memory and process-table pressure bounded.
      VITEST_MAX_THREADS: '2'
      VITEST_MAX_FORKS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test
      - run: bun run release:check
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-packages-${{ matrix.os }}
          path: |
            dist/release/*.tgz
            dist/release/SHA256SUMS
          if-no-files-found: error
